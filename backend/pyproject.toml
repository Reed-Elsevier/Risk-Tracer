[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "risktracer-backend"
version = "0.1.0"
description = "Deterministic evidence-led invoice investigations for RiskTracer"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1.0,<2",
  "fastapi>=0.115.0,<1",
  "networkx>=3.3,<4",
  "openai>=1.50.0,<2",
  "pandas>=2.2.0,<3",
  "pyarrow>=17.0.0,<19",
  "pydantic-settings>=2.5.0,<3",
  "rapidfuzz>=3.9.0,<4",
  "uvicorn[standard]>=0.30.0,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27.0,<1",
  "pytest>=8.3.0,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["."]
